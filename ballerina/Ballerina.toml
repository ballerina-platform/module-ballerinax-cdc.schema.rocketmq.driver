# OkHttp 4.x (BRE has 3.14.0 — incompatible major version, must declare 4.11.0)
[[platform.java21.dependency]]
groupId = "com.squareup.okhttp3"
artifactId = "okhttp"
version = "4.11.0"
path = "./lib/okhttp-4.11.0.jar"

# okio-jvm: BRE provides 3.4.0 which satisfies the 3.2.0 requirement — omitted here.

# Kotlin stdlib 1.6.20 (BRE has 1.6.0 — declare 1.6.20 to ensure correct version)
[[platform.java21.dependency]]
groupId = "org.jetbrains.kotlin"
artifactId = "kotlin-stdlib"
version = "1.6.20"
path = "./lib/kotlin-stdlib-1.6.20.jar"

[[platform.java21.dependency]]
