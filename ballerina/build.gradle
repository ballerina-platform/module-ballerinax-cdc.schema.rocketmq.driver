import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - CDC Schema RocketMQ Driver'

def packageName = "cdc.schema.rocketmq.driver"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
    isConnector = true
}

tasks.register('updateTomlFiles') {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newBallerinaToml = newBallerinaToml.replace("@toml.version@", tomlVersion)
        newBallerinaToml = newBallerinaToml.replace("@debezium.version@", debeziumVersion)
        newBallerinaToml = newBallerinaToml.replace("@rocketmq.version@", rocketmqVersion)
        newBallerinaToml = newBallerinaToml.replace("@rocketmq.proto.version@", rocketmqProtoVersion)
        newBallerinaToml = newBallerinaToml.replace("@rocketmq.logging.version@", rocketmqLoggingVersion)
        newBallerinaToml = newBallerinaToml.replace("@rocketmq.rocksdb.version@", rocketmqRocksdbVersion)
        newBallerinaToml = newBallerinaToml.replace("@commons.lang3.version@", commonsLang3Version)
        newBallerinaToml = newBallerinaToml.replace("@commons.cli.version@", commonsCliVersion)
        newBallerinaToml = newBallerinaToml.replace("@commons.validator.version@", commonsValidatorVersion)
        newBallerinaToml = newBallerinaToml.replace("@commons.digester.version@", commonsDigesterVersion)
        newBallerinaToml = newBallerinaToml.replace("@concurrentlinkedhashmap.version@", concurrentlinkedhashmap)
        newBallerinaToml = newBallerinaToml.replace("@zstd.jni.version@", zstdJniVersion)
        newBallerinaToml = newBallerinaToml.replace("@lz4.version@", lz4Version)
        newBallerinaToml = newBallerinaToml.replace("@grpc.version@", grpcVersion)
        newBallerinaToml = newBallerinaToml.replace("@protobuf.version@", protobufVersion)
        newBallerinaToml = newBallerinaToml.replace("@tomcat.annotations.version@", tomcatAnnotationsVersion)
        newBallerinaToml = newBallerinaToml.replace("@guava.version@", guavaVersion)
        newBallerinaToml = newBallerinaToml.replace("@failureaccess.version@", failureaccessVersion)
        newBallerinaToml = newBallerinaToml.replace("@perfmark.version@", perfmarkVersion)
        newBallerinaToml = newBallerinaToml.replace("@fastjson.version@", fastjsonVersion)
        newBallerinaToml = newBallerinaToml.replace("@otel.version@", otelVersion)
        newBallerinaToml = newBallerinaToml.replace("@otel.alpha.version@", otelAlphaVersion)
        newBallerinaToml = newBallerinaToml.replace("@otel.semconv.version@", otelSemconvVersion)
        newBallerinaToml = newBallerinaToml.replace("@okhttp.version@", okhttpVersion)
        newBallerinaToml = newBallerinaToml.replace("@kotlin.version@", kotlinVersion)
        ballerinaTomlFile.text = newBallerinaToml
    }
}

tasks.register('commitTomlFiles') {
    doLast {
        project.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv('publishUser')
                password = System.getenv('publishPAT')
            }
        }
    }
}

updateTomlFiles.dependsOn copyToLib

build.dependsOn "generatePomFileForMavenPublication"
build.dependsOn ":cdc.schema.rocketmq.driver-native:build"
test.dependsOn ":cdc.schema.rocketmq.driver-native:build"

publishToMavenLocal.dependsOn build
publish.dependsOn build
