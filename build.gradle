plugins {
    id 'com.github.spotbugs-base'
    id 'com.github.johnrengelman.shadow'
    id 'de.undercouch.download'
    id 'net.researchgate.release'
}

description = 'Ballerina - CDC RocketMQ Driver'

ext.ballerinaLangVersion = project.ballerinaLangVersion

allprojects {
    group = project.group
    version = project.version

    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

subprojects {
    configurations {
        externalJars
    }

    dependencies {
        // Debezium RocketMQ storage backend
        externalJars(group: 'io.debezium', name: 'debezium-storage-rocketmq', version: "${debeziumVersion}") {
            transitive = false
        }

        // RocketMQ client libraries
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-client', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-acl', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-common', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-remoting', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-srvutil', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-tools', version: "${rocketmqVersion}") {
            transitive = false
        }
        externalJars(group: 'org.apache.rocketmq', name: 'rocketmq-proto', version: "${rocketmqProtoVersion}") {
            transitive = false
        }
        externalJars(group: 'io.github.aliyunmq', name: 'rocketmq-slf4j-api', version: "${rocketmqLoggingVersion}") {
            transitive = false
        }
        // rocketmq-logback-classic shades logback internally (no external logback runtime dep)
        externalJars(group: 'io.github.aliyunmq', name: 'rocketmq-logback-classic', version: "${rocketmqLoggingVersion}") {
            transitive = false
        }
        externalJars(group: 'io.github.aliyunmq', name: 'rocketmq-rocksdb', version: "${rocketmqRocksdbVersion}") {
            transitive = false
        }
        externalJars(group: 'com.alibaba', name: 'fastjson', version: "${fastjsonVersion}") {
            transitive = false
        }

        // Commons utilities (commons-beanutils, commons-collections, gson excluded — already in BRE)
        externalJars(group: 'org.apache.commons', name: 'commons-lang3', version: "${commonsLang3Version}") {
            transitive = false
        }
        externalJars(group: 'commons-cli', name: 'commons-cli', version: "${commonsCliVersion}") {
            transitive = false
        }
        externalJars(group: 'commons-validator', name: 'commons-validator', version: "${commonsValidatorVersion}") {
            transitive = false
        }
        externalJars(group: 'commons-digester', name: 'commons-digester', version: "${commonsDigesterVersion}") {
            transitive = false
        }
        externalJars(group: 'com.googlecode.concurrentlinkedhashmap', name: 'concurrentlinkedhashmap-lru', version: "${concurrentlinkedhashmap}") {
            transitive = false
        }

        // Compression
        externalJars(group: 'com.github.luben', name: 'zstd-jni', version: "${zstdJniVersion}") {
            transitive = false
        }
        externalJars(group: 'org.lz4', name: 'lz4-java', version: "${lz4Version}") {
            transitive = false
        }

        // gRPC (used by rocketmq-client 5.x gRPC mode)
        externalJars(group: 'io.grpc', name: 'grpc-api', version: "${grpcVersion}") {
            transitive = false
        }
        externalJars(group: 'io.grpc', name: 'grpc-context', version: "${grpcVersion}") {
            transitive = false
        }
        externalJars(group: 'io.grpc', name: 'grpc-core', version: "${grpcVersion}") {
            transitive = false
        }
        externalJars(group: 'io.grpc', name: 'grpc-stub', version: "${grpcVersion}") {
            transitive = false
        }
        externalJars(group: 'io.grpc', name: 'grpc-netty-shaded', version: "${grpcVersion}") {
            transitive = false
        }

        // Protobuf
        externalJars(group: 'com.google.protobuf', name: 'protobuf-java', version: "${protobufVersion}") {
            transitive = false
        }
        externalJars(group: 'com.google.protobuf', name: 'protobuf-java-util', version: "${protobufVersion}") {
            transitive = false
        }

        // Tomcat annotations (required by gRPC)
        externalJars(group: 'org.apache.tomcat', name: 'annotations-api', version: "${tomcatAnnotationsVersion}") {
            transitive = false
        }

        // Guava (required by gRPC core and protobuf-java-util)
        externalJars(group: 'com.google.guava', name: 'guava', version: "${guavaVersion}") {
            transitive = false
        }
        externalJars(group: 'com.google.guava', name: 'failureaccess', version: "${failureaccessVersion}") {
            transitive = false
        }

        // PerfMark (required by grpc-core)
        externalJars(group: 'io.perfmark', name: 'perfmark-api', version: "${perfmarkVersion}") {
            transitive = false
        }

        // OpenTelemetry (pulled in by rocketmq-client 5.x for observability)
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-api', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-context', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk-common', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk-trace', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk-metrics', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk-logs', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-otlp', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-otlp-common', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-common', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-sender-okhttp', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-logging', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-logging-otlp', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-sdk-extension-autoconfigure-spi', version: "${otelVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-semconv', version: "${otelAlphaVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-extension-incubator', version: "${otelAlphaVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-api-events', version: "${otelAlphaVersion}") {
            transitive = false
        }
        externalJars(group: 'io.opentelemetry', name: 'opentelemetry-exporter-prometheus', version: "${otelAlphaVersion}") {
            transitive = false
        }

        // OkHttp (used by opentelemetry-exporter-sender-okhttp; BRE has 3.14.0 — we need 4.11.0)
        externalJars(group: 'com.squareup.okhttp3', name: 'okhttp', version: "${okhttpVersion}") {
            transitive = false
        }
        // okio-jvm: BRE has 3.4.0 (higher than needed 3.2.0), so exclude here
        // Kotlin stdlib: BRE has 1.6.0, we need 1.6.20 — declare to ensure correct version
        externalJars(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: "${kotlinVersion}") {
            transitive = false
        }
        externalJars(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-jdk7', version: "${kotlinVersion}") {
            transitive = false
        }
        externalJars(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-jdk8', version: "${kotlinVersion}") {
            transitive = false
        }
        externalJars(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-common', version: "${kotlinVersion}") {
            transitive = false
        }
    }
}

tasks.register('build') {
    dependsOn(':cdc.schema.rocketmq.driver-native:build')
    dependsOn(':cdc.schema.rocketmq.driver-ballerina:build')
}

release {
    buildTasks = ['build']
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v${version}'
    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}
